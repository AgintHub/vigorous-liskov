dag_type: plain_text
description: A workflow to put together a speech convincing people to go to the moon
name: convince_people_to_go_to_the_moon
nodes:
  compile_final_speech:
    agent: false
    description: Compile the final speech
    name: compile_final_speech
    nodes_depended_on:
    - write_speech_introduction
    - write_speech_body
    - write_speech_conclusion
    nodes_dependent_on: []
    prompt: Combine the introduction, body, and conclusion into a cohesive and persuasive
      speech.
  create_speech_outline:
    agent: false
    description: Create an outline for the speech
    name: create_speech_outline
    nodes_depended_on:
    - research_moon_benefits
    - research_moon_challenges
    nodes_dependent_on:
    - write_speech_introduction
    - write_speech_body
    - write_speech_conclusion
    prompt: Develop a detailed outline for a speech convincing people to go to the
      moon, including introduction, body, and conclusion.
  research_moon_benefits:
    agent: false
    description: Research the benefits of going to the moon
    name: research_moon_benefits
    nodes_depended_on: []
    nodes_dependent_on:
    - create_speech_outline
    prompt: List the scientific, economic, and exploratory benefits of sending humans
      to the moon.
  research_moon_challenges:
    agent: false
    description: Research the challenges of going to the moon
    name: research_moon_challenges
    nodes_depended_on: []
    nodes_dependent_on:
    - create_speech_outline
    prompt: Identify the major technical, logistical, and financial challenges of
      sending humans to the moon.
  write_speech_body:
    agent: false
    description: Write the body of the speech
    name: write_speech_body
    nodes_depended_on:
    - create_speech_outline
    nodes_dependent_on:
    - compile_final_speech
    prompt: Write the body of the speech, highlighting the benefits and addressing
      the challenges of going to the moon.
  write_speech_conclusion:
    agent: false
    description: Write the conclusion of the speech
    name: write_speech_conclusion
    nodes_depended_on:
    - create_speech_outline
    nodes_dependent_on:
    - compile_final_speech
    prompt: Write a strong conclusion for the speech, summarizing the main points
      and leaving a lasting impression on the audience.
  write_speech_introduction:
    agent: false
    description: Write the introduction for the speech
    name: write_speech_introduction
    nodes_depended_on:
    - create_speech_outline
    nodes_dependent_on:
    - compile_final_speech
    prompt: Write a compelling introduction for the speech, grabbing the audience's
      attention and setting the stage for the rest of the speech.
